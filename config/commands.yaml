# Configuration de voxjev : réglages, modes et commandes.
#
# Tout ce que le lanceur peut exécuter est déclaré ici. Jev ne fait que CHOISIR une
# commande parmi cette liste ; les arguments sont extraits par du code déterministe
# (regex + fuzzy matching) et injectés uniquement dans les champs autorisés.
#
# Types d'action (liste blanche) :
#   open_app   {app}                       -> open -a <app>
#   quit_app   {app}                       -> osascript (argv) : quit l'app
#   open_url   {url, app?}                 -> open [-a <app>] <url>   (args texte encodés en URL)
#   applescript{script, args?}             -> osascript -e <script figé> <args en argv>
#   keystroke  {key, modifiers?, app?}     -> System Events keystroke (touche figée)
#   shortcut   {name}                      -> shortcuts run <name figé>
#   exec       {argv}                      -> argv figé, argv[0] doit être dans settings.exec_allowlist
#   set_mode   {mode}                      -> change le mode actif (+ on_enter du mode)
#   sequence   {steps: [...]}              -> plusieurs actions à la suite
#   undo       {}                          -> rejoue le `undo:` de la dernière commande exécutée
#
# `label` (optionnel) : libellé court affiché dans l'interface, avec les arguments (« Ouvrir {app} »).
#
# Placeholders `{nom}` : uniquement des arguments déclarés dans `args` de la commande.
#   - type app  : nom résolu par fuzzy matching sur les apps installées (+ alias)
#   - type text : texte libre du transcript, TOUJOURS encodé (URL) ou passé en argv
#   - type enum : valeur tirée de la config (jamais du transcript)

settings:
  model: jev-latest
  threshold: 0.70            # p(commande) minimale pour exécuter sans confirmation
  confirm_floor: 0.40        # en dessous : ignoré ; entre floor et threshold : confirmation
  addressed_threshold: 0.70  # Noul « m'est-il adressé » : au-dessus, règles normales
  addressed_floor: 0.35      # en dessous : ignoré ; entre floor et threshold : confirmation
  destructive_threshold: 0.50  # Noul « destructif » au-dessus duquel on confirme
  hotkey: alt_r              # touche push-to-talk (noms pynput : alt_r, cmd_r, ctrl_r, f13...)
  stt_model: mlx-community/whisper-large-v3-turbo
  language: fr
  # Vocabulaire soufflé à Whisper (noms propres / jargon qu'il écorcherait sinon).
  stt_prompt: "Commandes vocales : ouvre Chrome, Burp, Ghostty, Notion, Spotify, CyberChef, GTFOBins, revshells, Exploit-DB, CVE, mode CTF."
  min_record_seconds: 0.3
  confirm_timeout_seconds: 10
  # Demandes composées (« ouvre Spotify et mets du jazz ») : Jev détecte, un petit LLM découpe,
  # chaque morceau repasse par le pipeline normal. Sans OPENROUTER_API_KEY : découpage par règles.
  fallback_min_p: 0.30       # si la commande choisie n'a pas d'argument valide, 2e option de Jev (avec confirmation)
  compound_threshold: 0.60
  max_plan_steps: 6
  step_delay_seconds: 0.8
  split_model: inception/mercury-2.5
  sounds:
    success: /System/Library/Sounds/Glass.aiff
    failure: /System/Library/Sounds/Basso.aiff
    listening: /System/Library/Sounds/Tink.aiff
    ignored: /System/Library/Sounds/Pop.aiff
  app_dirs:
    - /Applications
    - /Applications/Utilities
    - /System/Applications
    - /System/Applications/Utilities
    - ~/Applications
  exec_allowlist: [pmset, networksetup]
  # Retours : les réponses (agenda, heure, questions…) sont lues à voix haute (say).
  speak_answers: true
  voice: ""                 # voix de `say` (vide = voix du système ; ex. Thomas, Amélie)
  # Mode sans confirmation (activable dans le menu) : ces commandes sans risque s'exécutent
  # directement dès que Jev les reconnaît au-dessus des planchers (confirm_floor, addressed_floor).
  # Les actions destructives, la saisie de texte, les mails et les agents restent confirmés.
  quiet_mode: true
  safe_commands: [open_app, open_website, web_search, youtube_search, new_tab, volume_up, volume_down,
                  toggle_mute, play_pause, next_track, spotify_play, spotify_search, spotify_like, switch_mode,
                  key_shortcut, scroll, dark_mode, brightness_up, brightness_down, wifi_on, set_timer, info,
                  agenda_read, reminder_add, event_add, note_add, open_file, reveal_file, memory_add,
                  memory_ask, ask_question, screenshot, github_search, exploitdb_search, cve_search,
                  gtfobins_lookup, open_revshells, open_cyberchef, new_terminal_tab, new_email, new_note,
                  routine_matin, routine_concentration, undo_last, web_task, page_link]
  pick_min_p: 0.50           # choix de Jev parmi des candidats réels (menus, Raccourcis, segments, fichiers)
  # Jamais de saisie dictée ni d'agent bureau dans ces apps (un texte dicté n'y devient pas une commande).
  terminal_apps: [Terminal, iTerm2, Ghostty, Warp, kitty, Alacritty, WezTerm, Hyper, Tabby, Visual Studio Code, Cursor]
  # Formules de politesse retirées avant l'extraction des arguments.
  strip_phrases: ["s'il te plaît", "s'il te plait", "s'il vous plaît", "stp", "merci", "please"]
  # Noms parlés -> nom exact de l'app (uniquement si l'app est installée).
  app_aliases:
    chrome: Google Chrome
    google chrome: Google Chrome
    brave: Brave Browser
    burp: Burp Suite Community Edition
    burp suite: Burp Suite Community Edition
    vs code: Visual Studio Code
    vscode: Visual Studio Code
    visual studio: Visual Studio Code
    code: Visual Studio Code
    terminal: Terminal
    ghostty: Ghostty
    réglages: System Settings
    paramètres: System Settings
    préférences système: System Settings
    calendrier: Calendar
    calculatrice: Calculator
    musique: Music
    plans: Maps
    rappels: Reminders
    aperçu: Preview
    moniteur d'activité: Activity Monitor
    utilitaire de disque: Disk Utility
    app store: App Store
    whatsapp: WhatsApp
    teams: Microsoft Teams
    excel: Microsoft Excel
    mail: Mail
    courrier: Mail
    notes: Notes
    finder: Finder
  # Pour la question Choice, l'option « aucune / hors sujet ».
  none_option:
    what: "Aucune commande : conversation, question générale, réflexion à voix haute, bruit, ou demande qu'aucune commande de la liste ne couvre"
    examples:
      - "je pense qu'on devrait manger vers midi"
      - "tu as vu le match hier soir"
      - "il fait beau aujourd'hui hein"
      - "euh attends deux secondes"

modes:
  defaut:
    description: "Mode par défaut"
    aliases: [défaut, normal, standard, défaut normal]
    commands: []            # uniquement les commandes communes
  ctf:
    description: "Mode CTF / pentest"
    aliases: [ctf, capture the flag, pentest, hacking, sécu]
    on_enter:
      - {type: open_app, app: Ghostty, fallbacks: [Terminal]}
      - {type: open_app, app: Burp Suite Community Edition}
      - {type: open_app, app: Google Chrome, fallbacks: [Safari]}
    commands: [exploitdb_search, cve_search, gtfobins_lookup, open_revshells, open_cyberchef, new_terminal_tab]
  travail:
    description: "Mode travail"
    aliases: [travail, boulot, bureau, taf, work]
    on_enter:
      - {type: open_app, app: Mail}
      - {type: open_app, app: Calendar}
      - {type: open_app, app: Notion}
    commands: [new_email, github_search, new_note]

# Commandes disponibles dans tous les modes.
common: [open_app, quit_app, web_search, youtube_search, open_website, volume_up, volume_down,
         toggle_mute, play_pause, next_track, screenshot, lock_screen, sleep_display,
         empty_trash, close_window, new_tab, switch_mode, spotify_play, spotify_like, spotify_search, web_task, undo_last,
         menu_item, run_shortcut, type_text, type_text_enter, key_shortcut, scroll, dark_mode, brightness_up,
         brightness_down, wifi_off, wifi_on, set_timer, info, reminder_add, event_add, agenda_read, note_add,
         mail_draft, mail_triage, open_file, reveal_file, memory_add, memory_ask, memory_forget, ask_question,
         desktop_task, page_link]

commands:
  # ---------------------------------------------------------------- apps
  - id: open_app
    label: "Ouvrir {app}"
    description: "Ouvrir, lancer ou afficher une application installée (sans autre action)"
    examples: ["ouvre Spotify", "lance Visual Studio Code", "démarre le terminal"]
    destructive: false
    args:
      app:
        type: app
        patterns:
          - "(?:ouvr\\w*|lanc\\w*|démarr\\w*|affich\\w*|va sur|passe sur|bascule sur)\\s+(?:-?moi\\s+)?(?:l'application\\s+|l'appli\\s+|l'app\\s+|le\\s+|la\\s+|les\\s+|l')?(?P<app>.+)"
    action: {type: open_app, app: "{app}"}
    undo: {type: quit_app, app: "{app}"}

  - id: quit_app
    label: "Quitter {app}"
    description: "Quitter ou fermer complètement une application"
    examples: ["quitte Spotify", "ferme complètement Chrome", "ferme l'application Notion"]
    destructive: true
    args:
      app:
        type: app
        patterns:
          - "(?:quitt\\w*|ferm\\w*|tu\\w*|arrêt\\w*)\\s+(?:complètement\\s+)?(?:l'application\\s+|l'app\\s+|le\\s+|la\\s+|l')?(?P<app>.+)"
    action: {type: quit_app, app: "{app}"}
    undo: {type: open_app, app: "{app}"}

  # ---------------------------------------------------------------- web
  - id: web_search
    label: "Rechercher « {query} » sur le web"
    description: "Faire une recherche sur le web (Google), éventuellement dans un navigateur précis"
    examples: ["cherche la météo à Lyon", "ouvre Chrome et cherche des recettes de crêpes", "recherche sur Google le prix du bitcoin"]
    destructive: false
    args:
      query:
        type: text
        patterns:
          - "(?:re)?cherch\\w*\\s+(?:-?moi\\s+)?(?:sur (?:google|internet|le web)\\s+)?(?P<query>.+?)(?:\\s+(?:dans|sur|avec)\\s+(?:google chrome|chrome|safari|arc|brave|firefox|google|internet))?$"
          - "google\\s+(?P<query>.+)$"
      browser:
        type: app
        optional: true
        choices: [Google Chrome, Safari, Arc, Brave Browser]
        patterns:
          - "(?:ouvr\\w*|lanc\\w*|dans|sur|avec)\\s+(?P<browser>google chrome|chrome|safari|arc|brave)\\b"
    action: {type: open_url, url: "https://www.google.com/search?q={query}", app: "{browser}"}

  - id: youtube_search
    label: "YouTube : « {query} »"
    description: "Chercher ou lancer une vidéo sur YouTube"
    examples: ["mets du lofi sur YouTube", "cherche un tuto Python sur YouTube", "YouTube vidéos de chats"]
    destructive: false
    args:
      query:
        type: text
        patterns:
          - "(?:mets|lance|cherche|recherche|trouve)\\w*\\s+(?:-?moi\\s+)?(?P<query>.+?)\\s+sur\\s+youtube"
          - "(?:sur\\s+)?youtube\\s*,?\\s+(?:cherche\\s+|mets\\s+)?(?P<query>.+)$"
    action: {type: open_url, url: "https://www.youtube.com/results?search_query={query}"}

  - id: open_website
    label: "Ouvrir {site}"
    description: "Ouvrir un site web connu (YouTube, GitHub, Gmail, ChatGPT, LinkedIn, Netflix)"
    examples: ["ouvre GitHub", "va sur Gmail", "affiche mes mails Gmail"]
    destructive: false
    args:
      site:
        type: enum
        values:
          youtube: {aliases: [youtube], value: "https://www.youtube.com"}
          github: {aliases: [github, git hub], value: "https://github.com"}
          gmail: {aliases: [gmail, mails gmail], value: "https://mail.google.com"}
          chatgpt: {aliases: [chatgpt, chat gpt], value: "https://chatgpt.com"}
          linkedin: {aliases: [linkedin, linked in], value: "https://www.linkedin.com"}
          netflix: {aliases: [netflix], value: "https://www.netflix.com"}
    action: {type: open_url, url: "{site}"}

  # ---------------------------------------------------------------- son / musique
  - id: volume_up
    label: "Monter le volume"
    description: "Monter le volume sonore de l'ordinateur"
    examples: ["monte le son", "plus fort", "augmente le volume"]
    destructive: false
    action: {type: applescript, script: "set volume output volume ((output volume of (get volume settings)) + 12)"}
    undo: {type: applescript, script: "set volume output volume ((output volume of (get volume settings)) - 12)"}

  - id: volume_down
    label: "Baisser le volume"
    description: "Baisser le volume sonore de l'ordinateur"
    examples: ["baisse le son", "moins fort", "diminue le volume"]
    destructive: false
    action: {type: applescript, script: "set volume output volume ((output volume of (get volume settings)) - 12)"}
    undo: {type: applescript, script: "set volume output volume ((output volume of (get volume settings)) + 12)"}

  - id: toggle_mute
    label: "Couper / remettre le son"
    description: "Couper ou remettre le son de l'ordinateur (muet)"
    examples: ["coupe le son", "mode muet", "remets le son"]
    destructive: false
    action: {type: applescript, script: "set volume output muted (not (output muted of (get volume settings)))"}
    undo: {type: applescript, script: "set volume output muted (not (output muted of (get volume settings)))"}

  - id: play_pause
    label: "Lecture / pause"
    description: "Mettre en pause ou reprendre la musique (Spotify)"
    examples: ["pause", "mets la musique en pause", "relance la musique"]
    destructive: false
    action: {type: applescript, script: "tell application \"Spotify\" to playpause"}
    undo: {type: applescript, script: "tell application \"Spotify\" to playpause"}

  - id: next_track
    label: "Morceau suivant"
    description: "Passer au morceau de musique suivant (Spotify)"
    examples: ["chanson suivante", "passe au morceau suivant", "next"]
    destructive: false
    action: {type: applescript, script: "tell application \"Spotify\" to next track"}
    undo: {type: applescript, script: "tell application \"Spotify\" to previous track"}

  # ---------------------------------------------------------------- annulation
  - id: undo_last
    label: "Annuler la dernière action"
    description: "Annuler / défaire la dernière action que l'assistant vient d'exécuter"
    examples: ["annule ça", "annule la dernière action", "reviens en arrière, je ne voulais pas ça"]
    destructive: false
    action: {type: undo}

  # ---------------------------------------------------------------- Spotify
  - id: spotify_play
    label: "Spotify : lancer « {query} »"
    description: "Lancer la lecture d'un morceau, d'un artiste, d'un album ou d'une playlist précis sur Spotify"
    examples: ["mets Get Lucky de Daft Punk sur Spotify", "joue du Stromae", "lance la chanson Bohemian Rhapsody"]
    destructive: false
    args:
      query:
        type: text
        patterns:
          - "(?:mets|joue|lance|écoute|passe|fais écouter)\\w*\\s+(?:-?moi\\s+)?(?:la chanson |le morceau |le titre |le son |l'album |la playlist |un peu de |du |de la |de l'|des )?(?P<query>.+?)(?:\\s+(?:sur|dans|avec)\\s+spotify)?$"
    action: {type: spotify, op: play, query: "{query}"}
    undo: {type: applescript, script: "tell application \"Spotify\" to pause"}

  - id: spotify_like
    label: "Spotify : liker le morceau en cours"
    description: "Liker sur Spotify (ajouter aux titres likés) le morceau en cours d'écoute, même si son titre est cité ; ne lance aucune lecture"
    examples: ["like ce morceau", "like le morceau en cours sur Spotify", "ajoute ce son à mes titres likés", "mets un like à la chanson qui passe", "like Hey Jude sur Spotify"]
    destructive: false
    action: {type: spotify, op: like}

  - id: spotify_search
    label: "Spotify : chercher « {query} »"
    description: "Chercher quelque chose dans l'app Spotify, sans le lancer"
    examples: ["cherche Daft Punk dans Spotify", "recherche des podcasts de science sur Spotify", "trouve la playlist lofi dans Spotify"]
    destructive: false
    args:
      query:
        type: text
        patterns:
          - "(?:cherch\\w*|recherch\\w*|trouv\\w*)\\s+(?:-?moi\\s+)?(?P<query>.+?)\\s+(?:dans|sur)\\s+spotify"
    action: {type: spotify, op: search, query: "{query}"}

  # ---------------------------------------------------------------- agent web
  - id: web_task
    label: "Agent web : « {goal} »"
    description: "Réaliser une tâche en plusieurs étapes à l'intérieur d'un site web : remplir un formulaire de recherche, choisir des filtres, comparer (vols, produits, itinéraires). Pas pour ouvrir simplement un lien ou un résultat de la page déjà affichée"
    examples: ["trouve-moi un vol Paris Lisbonne le 12 octobre", "ouvre l'article Wikipédia sur la relativité générale", "cherche un itinéraire à vélo de Lyon à Annecy sur Google Maps"]
    destructive: false
    always_confirm: false  # garde-fous dans l'agent : arrêt avant achat/paiement/envoi/suppression
    args:
      goal:
        type: text
        patterns: ["(?P<goal>.+)"]
      site:
        type: enum
        default: google
        values:
          google: {aliases: [google], value: "https://www.google.com/?hl=fr"}
          flights: {aliases: [vol, vols, avion, google flights], value: "https://www.google.com/travel/flights?hl=fr"}
          wikipedia: {aliases: [wikipédia, wikipedia, wiki], value: "https://fr.wikipedia.org/wiki/Accueil"}
          maps: {aliases: [maps, google maps, itinéraire, trajet], value: "https://www.google.com/maps?hl=fr"}
          youtube: {aliases: [youtube], value: "https://www.youtube.com"}
          amazon: {aliases: [amazon], value: "https://www.amazon.fr"}
          github: {aliases: [github, git hub], value: "https://github.com"}
    action: {type: web_task, goal: "{goal}", url: "{site}"}

  # ---------------------------------------------------------------- système
  - id: screenshot
    label: "Capture d'écran"
    description: "Faire une capture d'écran d'une zone de l'écran"
    examples: ["fais une capture d'écran", "screenshot", "capture l'écran"]
    destructive: false
    action: {type: keystroke, key: "4", modifiers: [command, shift]}

  - id: lock_screen
    label: "Verrouiller l'écran"
    description: "Verrouiller l'écran de l'ordinateur"
    examples: ["verrouille l'écran", "verrouille l'ordi", "lock"]
    destructive: false
    action: {type: keystroke, key: "q", modifiers: [control, command]}

  - id: sleep_display
    label: "Éteindre l'écran"
    description: "Éteindre l'écran / mettre l'écran en veille"
    examples: ["éteins l'écran", "mets l'écran en veille", "coupe l'écran"]
    destructive: false
    action: {type: exec, argv: [pmset, displaysleepnow]}

  - id: empty_trash
    label: "Vider la corbeille"
    description: "Vider la corbeille (suppression définitive des fichiers)"
    examples: ["vide la corbeille", "vide la poubelle", "supprime tout ce qu'il y a dans la corbeille"]
    destructive: true
    action: {type: applescript, script: "tell application \"Finder\" to empty trash"}

  - id: close_window
    label: "Fermer la fenêtre"
    description: "Fermer la fenêtre ou l'onglet actuellement au premier plan"
    examples: ["ferme cette fenêtre", "ferme l'onglet", "ferme ça"]
    destructive: false
    action: {type: keystroke, key: "w", modifiers: [command]}

  - id: new_tab
    label: "Nouvel onglet"
    description: "Ouvrir un nouvel onglet dans l'application au premier plan"
    examples: ["nouvel onglet", "ouvre un nouvel onglet", "crée un onglet"]
    destructive: false
    action: {type: keystroke, key: "t", modifiers: [command]}
    undo: {type: keystroke, key: "w", modifiers: [command]}

  - id: switch_mode
    label: "Passer en mode {mode}"
    description: "Changer le mode de l'assistant (défaut, CTF, travail)"
    examples: ["passe en mode CTF", "mode travail", "reviens au mode normal"]
    destructive: false
    args:
      mode:
        type: mode
        patterns:
          - "mode\\s+(?P<mode>.+)$"
          - "(?:passe|bascule|active)\\w*\\s+(?:en|au|le)\\s+(?P<mode>.+)$"
    action: {type: set_mode, mode: "{mode}"}
    undo: {type: set_mode, mode: "{previous_mode}"}

  # ---------------------------------------------------------------- mode CTF
  - id: exploitdb_search
    label: "Exploit-DB : « {query} »"
    description: "Chercher un exploit sur Exploit-DB"
    examples: ["cherche un exploit pour vsftpd", "exploit db apache struts", "trouve un exploit pour wordpress 5.0"]
    destructive: false
    args:
      query:
        type: text
        patterns:
          - "exploits?\\s*(?:-?\\s*db)?\\s+(?:pour|sur|de)?\\s*(?P<query>.+)$"
    action: {type: open_url, url: "https://www.exploit-db.com/search?q={query}"}

  - id: cve_search
    label: "CVE : « {query} »"
    description: "Chercher une vulnérabilité CVE par identifiant ou par produit"
    examples: ["cherche la CVE 2021 44228", "cve log4j", "vulnérabilités connues de openssl"]
    destructive: false
    args:
      query:
        type: text
        patterns:
          - "(?P<query>cve[\\s-]*\\d{4}[\\s-]+\\d{3,7})"
          - "(?:cve|vulnérabilités?(?:\\s+connues)?)\\s+(?:de\\s+|pour\\s+|sur\\s+)?(?P<query>.+)$"
        rewrite:
          - ["cve[\\s-]*(\\d{4})[\\s-]+(\\d{3,7})", "CVE-\\1-\\2"]
    action: {type: open_url, url: "https://www.cve.org/CVERecord/SearchResults?query={query}"}

  - id: gtfobins_lookup
    label: "GTFOBins : {binary}"
    description: "Ouvrir la page GTFOBins d'un binaire Unix (élévation de privilèges)"
    examples: ["gtfobins find", "ouvre gtfo bins pour vim", "comment escalader avec tar sur gtfobins"]
    destructive: false
    args:
      binary:
        type: text
        path_segment: true
        patterns:
          - "gtfo\\s*bins?\\s+(?:pour\\s+|de\\s+)?(?P<binary>[\\w.+-]+)"
          - "(?:avec|pour)\\s+(?P<binary>[\\w.+-]+)\\s+sur\\s+gtfo\\s*bins?"
    action: {type: open_url, url: "https://gtfobins.github.io/gtfobins/{binary}/"}

  - id: open_revshells
    label: "Ouvrir revshells"
    description: "Ouvrir le générateur de reverse shell (revshells.com)"
    examples: ["ouvre revshells", "il me faut un reverse shell", "générateur de reverse shell"]
    destructive: false
    action: {type: open_url, url: "https://www.revshells.com/"}

  - id: open_cyberchef
    label: "Ouvrir CyberChef"
    description: "Ouvrir CyberChef pour décoder ou transformer des données"
    examples: ["ouvre cyberchef", "il faut que je décode du base64", "lance cyber chef"]
    destructive: false
    action: {type: open_url, url: "https://gchq.github.io/CyberChef/"}

  - id: new_terminal_tab
    label: "Nouveau terminal"
    description: "Ouvrir un nouvel onglet ou une nouvelle fenêtre de terminal"
    examples: ["nouveau terminal", "ouvre un nouvel onglet de terminal", "un autre shell"]
    destructive: false
    action:
      type: sequence
      steps:
        - {type: keystroke, key: "t", modifiers: [command], app: Ghostty, fallbacks: [Terminal]}

  # ---------------------------------------------------------------- mode travail
  - id: new_email
    label: "Nouvel e-mail"
    description: "Écrire un nouvel e-mail"
    examples: ["nouveau mail", "écris un e-mail", "rédige un nouveau message électronique"]
    destructive: false
    action: {type: open_url, url: "mailto:"}

  - id: github_search
    label: "GitHub : « {query} »"
    description: "Chercher un dépôt ou du code sur GitHub"
    examples: ["cherche fastapi sur GitHub", "github recherche whisper mlx", "trouve un repo de parseur yaml sur GitHub"]
    destructive: false
    args:
      query:
        type: text
        patterns:
          - "(?:cherch\\w*|trouv\\w*|recherch\\w*)\\s+(?:un\\s+(?:repo|dépôt)\\s+(?:de\\s+)?)?(?P<query>.+?)\\s+sur\\s+git\\s*hub"
          - "git\\s*hub\\s+(?:cherche\\s+|recherche\\s+)?(?P<query>.+)$"
    action: {type: open_url, url: "https://github.com/search?q={query}&type=repositories"}

  - id: new_note
    label: "Nouvelle note"
    description: "Créer une nouvelle note dans Notes"
    examples: ["nouvelle note", "prends une note", "crée une note"]
    destructive: false
    action:
      type: sequence
      steps:
        - {type: keystroke, key: "n", modifiers: [command], app: Notes}

  # ================================================================= quotidien
  # ---------------------------------------------------------------- n'importe quelle app
  - id: menu_item
    label: "Menu : {item}"
    description: "Cliquer une commande des menus de l'app au premier plan (Fichier, Édition, Présentation, Format…) : exporter, dupliquer, nouvelle fenêtre privée, afficher une barre latérale, zoomer… quand aucune commande plus précise ne convient"
    examples: ["exporte en PDF", "ouvre une nouvelle fenêtre de navigation privée", "affiche la barre latérale", "duplique ce document", "mets le texte en gras"]
    destructive: false
    args:
      item: {type: pick, source: menu}
    action: {type: menu, item: "{item}"}

  - id: run_shortcut
    label: "Raccourci « {shortcut} »"
    description: "Lancer un des Raccourcis de l'utilisateur (app Raccourcis de macOS)"
    examples: ["lance le raccourci créer un code QR", "exécute mon raccourci Shazam", "fais le raccourci prix de l'ethereum"]
    destructive: false
    args:
      shortcut: {type: pick, source: shortcut}
    action: {type: shortcut, name: "{shortcut}"}

  - id: type_text
    label: "Taper « {text} »"
    description: "Taper au clavier un texte dicté dans le champ ou le document actif (sans valider)"
    examples: ["tape bonjour tout le monde", "écris je serai en retard de dix minutes", "saisis rendez-vous confirmé", "tape merci beaucoup"]
    destructive: false
    args:
      text:
        type: text
        patterns:
          - "^(?:tape|tapes|écris|ecris|saisis|dactylographie)\\s+(?:le texte\\s+|ceci\\s*:?\\s*)?(?P<text>.+)$"
    action: {type: type_text, text: "{text}"}

  - id: type_text_enter
    label: "Taper « {text} » puis Entrée"
    description: "Taper un texte dicté puis appuyer sur Entrée (envoyer un message dans une messagerie, valider une recherche)"
    examples: ["tape salut ça va et envoie", "écris ok pour moi et appuie sur entrée", "tape météo Paris et valide"]
    destructive: false
    always_confirm: true
    args:
      text:
        type: text
        patterns:
          - "^(?:tape|tapes|écris|ecris|saisis)\\s+(?P<text>.+?)\\s+(?:et|puis)\\s+(?:envoie|envoies|valide|valides|appuie sur entrée|fais entrée|entrée)$"
    action: {type: type_text, text: "{text}", submit: true}

  - id: key_shortcut
    label: "Raccourci clavier : {combo}"
    description: "Appuyer sur un raccourci clavier standard : copier, coller, couper, tout sélectionner, défaire la frappe (⌘Z), rétablir, enregistrer, rechercher dans la page, imprimer, recharger, page ou onglet précédent/suivant, rouvrir l'onglet fermé, zoom du texte, plein écran, Entrée, Échap, Tab, Spotlight"
    examples: ["copie", "colle", "sélectionne tout", "enregistre", "recharge la page", "reviens à la page précédente", "rouvre l'onglet fermé", "appuie sur entrée", "fais échap", "ctrl z"]
    destructive: false
    args:
      combo:
        type: enum
        values:
          copy: {aliases: [copie, copier, copy], value: "cmd+c"}
          paste: {aliases: [colle, coller, paste], value: "cmd+v"}
          cut: {aliases: [coupe, couper, cut], value: "cmd+x"}
          select_all: {aliases: [sélectionne tout, tout sélectionner, select all], value: "cmd+a"}
          undo_typing: {aliases: [ctrl z, commande z, défais, défaire, annule la frappe, annuler la saisie], value: "cmd+z"}
          redo: {aliases: [rétablis, rétablir, refais], value: "cmd+shift+z"}
          save: {aliases: [enregistre, sauvegarde, sauvegarder, enregistrer], value: "cmd+s"}
          find: {aliases: [cherche dans la page, rechercher dans la page, trouve dans la page, ctrl f], value: "cmd+f"}
          print: {aliases: [imprime, imprimer], value: "cmd+p"}
          reload: {aliases: [recharge, rafraîchis, actualise, reload], value: "cmd+r"}
          back: {aliases: [page précédente, reviens en arrière sur la page, retour, précédent], value: "cmd+["}
          forward: {aliases: [page suivante, avance, suivant], value: "cmd+]"}
          prev_tab: {aliases: [onglet précédent, onglet de gauche], value: "cmd+shift+["}
          next_tab: {aliases: [onglet suivant, onglet de droite], value: "cmd+shift+]"}
          reopen_tab: {aliases: [rouvre l'onglet, rouvrir l'onglet fermé, onglet fermé], value: "cmd+shift+t"}
          zoom_in: {aliases: [agrandis, zoom avant, plus gros, grossis], value: "cmd+="}
          zoom_out: {aliases: [rétrécis, zoom arrière, plus petit], value: "cmd+-"}
          zoom_reset: {aliases: [taille normale, zoom normal], value: "cmd+0"}
          fullscreen: {aliases: [plein écran], value: "ctrl+cmd+f"}
          hide: {aliases: [masque l'app, cache l'app, masquer], value: "cmd+h"}
          minimize: {aliases: [réduis la fenêtre, minimise], value: "cmd+m"}
          new_window: {aliases: [nouvelle fenêtre], value: "cmd+n"}
          enter: {aliases: [entrée, valide, appuie sur entrée], value: "code:36"}
          escape: {aliases: [échap, escape, echap], value: "code:53"}
          tab: {aliases: [tabulation, tab], value: "code:48"}
          spotlight: {aliases: [spotlight], value: "cmd+code:49"}
    action: {type: keycombo, combo: "{combo}"}

  - id: scroll
    label: "Défilement : {direction}"
    description: "Faire défiler la page ou le document (descendre, remonter, tout en haut, tout en bas)"
    examples: ["descends", "fais défiler vers le bas", "remonte", "va tout en haut", "va tout en bas de la page"]
    destructive: false
    args:
      direction:
        type: enum
        values:
          top: {aliases: [tout en haut, en haut de la page, début], value: "code:115"}
          bottom: {aliases: [tout en bas, en bas de la page, fin de la page], value: "code:119"}
          up: {aliases: [remonte, monte, vers le haut, haut], value: "code:116"}
          down: {aliases: [descends, descend, vers le bas, bas, défile], value: "code:121"}
        default: down
    action: {type: keycombo, combo: "{direction}"}

  # ---------------------------------------------------------------- réglages système
  - id: dark_mode
    label: "Apparence : {theme}"
    description: "Passer en mode sombre, en mode clair, ou basculer l'apparence de macOS"
    examples: ["mets le mode sombre", "passe en mode clair", "change le thème"]
    destructive: false
    args:
      theme:
        type: enum
        values:
          dark: {aliases: [sombre, dark, nuit, noir], value: "dark"}
          light: {aliases: [clair, light, jour, blanc], value: "light"}
          toggle: {aliases: [change, bascule, inverse], value: "toggle"}
        default: toggle
    action:
      type: applescript
      script: |
        on run argv
        tell application "System Events" to tell appearance preferences
        if item 1 of argv is "toggle" then set dark mode to not dark mode
        if item 1 of argv is "dark" then set dark mode to true
        if item 1 of argv is "light" then set dark mode to false
        end tell
        end run
      args: ["{theme}"]
    undo: {type: applescript, script: "tell application \"System Events\" to tell appearance preferences to set dark mode to not dark mode"}

  - id: brightness_up
    label: "Luminosité +"
    description: "Augmenter la luminosité de l'écran"
    examples: ["plus de lumière", "augmente la luminosité", "écran plus lumineux"]
    destructive: false
    action: {type: keycombo, combo: "code:144"}
    undo: {type: keycombo, combo: "code:145"}

  - id: brightness_down
    label: "Luminosité −"
    description: "Baisser la luminosité de l'écran"
    examples: ["baisse la luminosité", "moins de lumière", "écran moins lumineux"]
    destructive: false
    action: {type: keycombo, combo: "code:145"}
    undo: {type: keycombo, combo: "code:144"}

  - id: wifi_off
    label: "Couper le Wi-Fi"
    description: "Désactiver le Wi-Fi"
    examples: ["coupe le wifi", "désactive le wi-fi", "éteins le wifi"]
    destructive: false
    action: {type: exec, argv: [networksetup, -setairportpower, en0, "off"]}
    undo: {type: exec, argv: [networksetup, -setairportpower, en0, "on"]}

  - id: wifi_on
    label: "Activer le Wi-Fi"
    description: "Activer le Wi-Fi"
    examples: ["active le wifi", "rallume le wi-fi", "remets le wifi"]
    destructive: false
    action: {type: exec, argv: [networksetup, -setairportpower, en0, "on"]}
    undo: {type: exec, argv: [networksetup, -setairportpower, en0, "off"]}

  # ---------------------------------------------------------------- temps, rappels, agenda
  - id: set_timer
    label: "Minuteur {duration}"
    description: "Lancer un minuteur / compte à rebours d'une durée donnée"
    examples: ["mets un minuteur de 10 minutes", "minuteur 3 minutes pour les pâtes", "préviens-moi dans une demi-heure", "compte à rebours de 90 secondes"]
    destructive: false
    args:
      duration: {type: duration}
      label:
        type: text
        optional: true
        span: false
        patterns:
          - "\\bpour\\s+(?:les\\s+|le\\s+|la\\s+|l')?(?P<label>[^\\d].*)$"
    action: {type: timer, seconds: "{duration}", label: "{label}"}

  - id: info
    label: "Info : {what}"
    description: "Donner l'heure, la date du jour, le niveau de batterie ou le temps restant sur les minuteurs"
    examples: ["quelle heure est-il", "on est quel jour", "il reste combien de batterie", "combien de temps reste-t-il sur le minuteur"]
    destructive: false
    args:
      what:
        type: enum
        values:
          time: {aliases: [heure, quelle heure], value: time}
          date: {aliases: [quel jour, date, on est le combien, quel jour on est], value: date}
          battery: {aliases: [batterie, charge, autonomie], value: battery}
          timers: {aliases: [minuteur, minuteurs, compte à rebours], value: timers}
    action: {type: info, what: "{what}"}

  - id: reminder_add
    label: "Rappel « {what} » {when}"
    description: "Créer un rappel (app Rappels), avec ou sans date : « rappelle-moi de… »"
    examples: ["rappelle-moi d'appeler Paul demain à 18h", "rappelle-moi de sortir le linge dans 20 minutes", "ajoute un rappel acheter du pain"]
    destructive: false
    args:
      what:
        type: text
        strip_when: true
        patterns:
          - "rappelle[- ]moi\\s+(?:de\\s+|d'|qu'|que\\s+)?(?P<what>.+)$"
          - "(?:ajoute|crée|cree|mets|créer)\\s+(?:moi\\s+)?un\\s+rappel\\s+(?:pour\\s+|de\\s+|d'|:\\s*)?(?P<what>.+)$"
          - "^rappel\\s*:?\\s+(?P<what>.+)$"
      when: {type: when, optional: true}
    action: {type: reminder, title: "{what}", when: "{when}"}

  - id: event_add
    label: "Agenda : « {title} » {when}"
    description: "Ajouter un rendez-vous, une réunion ou un événement daté à l'agenda (app Calendrier)"
    examples: ["ajoute un rendez-vous chez le dentiste mardi à 14h", "mets une réunion avec l'équipe demain à 10h", "crée un événement anniversaire de Léa le 12 octobre"]
    destructive: false
    args:
      title:
        type: text
        strip_when: true
        patterns:
          - "(?:ajoute|crée|cree|mets|note|programme|planifie|cale)\\s+(?:moi\\s+)?(?:un\\s+|une\\s+)?(?:événement\\s+|évènement\\s+)?(?P<title>(?:rendez-vous|rdv|réunion|reunion|appel|call|déjeuner|dîner|diner|cours|anniversaire|entretien|séance|seance|match|visio)?.+?)(?:\\s+(?:à|dans)\\s+(?:l'|mon\\s+)?(?:agenda|calendrier))?$"
      when: {type: when}
    action: {type: calendar_add, title: "{title}", when: "{when}", minutes: 60}

  - id: agenda_read
    label: "Agenda {when}"
    description: "Lire les événements de l'agenda d'un jour (aujourd'hui par défaut) : « qu'est-ce que j'ai demain ? »"
    examples: ["qu'est-ce que j'ai aujourd'hui", "c'est quoi mon programme demain", "lis-moi mon agenda de lundi", "j'ai des rendez-vous cet après-midi"]
    destructive: false
    args:
      when: {type: when, optional: true}
    action: {type: calendar_read, when: "{when}"}

  - id: note_add
    label: "Note : « {body} »"
    description: "Écrire une note dictée dans l'app Notes"
    examples: ["note que je dois acheter des piles", "prends en note le code wifi de l'hôtel est 4521", "écris dans mes notes idée de cadeau pour Léa"]
    destructive: false
    args:
      body:
        type: text
        patterns:
          - "^(?:note|notes|prends note|prends en note|écris dans mes notes|ajoute à mes notes|ajoute dans mes notes)\\s+(?:que\\s+|qu'|:\\s*)?(?P<body>.+)$"
    action: {type: note_add, body: "{body}"}

  - id: mail_draft
    label: "Brouillon d'e-mail {to}"
    description: "Rédiger un brouillon d'e-mail à partir d'une consigne dictée (jamais envoyé automatiquement)"
    examples: ["écris un mail à Paul pour lui dire que je serai en retard", "prépare un e-mail à Marie pour la remercier", "rédige un mail au propriétaire pour signaler la fuite"]
    destructive: false
    args:
      to:
        type: text
        optional: true
        span: false
        patterns:
          - "(?:mail|e-mail|email|courriel|message)\\s+(?:à|a|pour)\\s+(?!l'|la\\b|le\\b|les\\b|mon\\b|ma\\b|mes\\b)(?P<to>[\\w-]+)"
      body:
        type: text
        patterns: ["^(?P<body>.+)$"]
    action: {type: mail_draft, to: "{to}", body: "{body}"}

  - id: mail_triage
    label: "Tri des mails non lus"
    description: "Passer en revue les e-mails non lus et dire lesquels demandent une action ou sont importants"
    examples: ["quels mails demandent une action", "trie mes mails", "j'ai des mails importants", "est-ce que j'ai des mails urgents"]
    destructive: false
    action: {type: mail_triage}

  # ---------------------------------------------------------------- fichiers
  - id: open_file
    label: "Ouvrir le fichier {name}"
    description: "Retrouver un fichier ou document de l'utilisateur par son nom et l'ouvrir"
    examples: ["ouvre le fichier rapport de stage", "ouvre mon CV", "ouvre la présentation du projet voxjev", "retrouve le PDF de la facture EDF"]
    destructive: false
    args:
      name:
        type: text
        patterns:
          - "(?:ouvre|affiche|trouve|retrouve|cherche)\\s+(?:-?moi\\s+)?(?:le\\s+|la\\s+|les\\s+|l'|mon\\s+|ma\\s+|mes\\s+)?(?P<name>(?:fichier|document|doc|pdf|présentation|presentation|tableur|feuille|image|photo|cv|facture|contrat).*)$"
    action: {type: file_open, query: "{name}"}

  - id: reveal_file
    label: "Montrer le fichier {name} dans le Finder"
    description: "Retrouver un fichier et le montrer dans le Finder (sans l'ouvrir)"
    examples: ["montre-moi où est le fichier rapport de stage", "affiche le dossier de ma facture EDF dans le Finder", "révèle mon CV dans le Finder"]
    destructive: false
    args:
      name:
        type: text
        patterns:
          - "(?:montre|affiche|révèle|revele)\\s*(?:-?moi\\s+)?(?:où\\s+est\\s+)?(?:le\\s+|la\\s+|l'|mon\\s+|ma\\s+)?(?:dossier\\s+de\\s+(?:ma\\s+|mon\\s+|la\\s+|le\\s+)?)?(?P<name>.+?)(?:\\s+dans\\s+le\\s+finder)?$"
    action: {type: file_open, query: "{name}", reveal: true}

  # ---------------------------------------------------------------- mémoire et questions
  - id: memory_add
    label: "Retenir « {fact} »"
    description: "Retenir une information personnelle pour plus tard (« retiens que… »)"
    examples: ["retiens que mon dentiste c'est le docteur Martin", "souviens-toi que le code du portail est 1234", "mémorise que Léa est allergique aux noix"]
    destructive: false
    args:
      fact:
        type: text
        patterns:
          - "(?:retiens|souviens[- ]toi|mémorise|memorise|garde en mémoire)\\s+(?:bien\\s+)?(?:que\\s+|qu'|:\\s*)?(?P<fact>.+)$"
    action: {type: memory_add, fact: "{fact}"}

  - id: memory_ask
    label: "Mémoire : {question}"
    description: "Retrouver une information personnelle que l'utilisateur m'a demandé de retenir"
    examples: ["c'est qui mon dentiste déjà", "qu'est-ce que je t'avais dit sur le code du portail", "Léa est allergique à quoi déjà", "redis-moi le nom du garagiste"]
    destructive: false
    args:
      question: {type: text, span: false, patterns: ["^(?P<question>.+)$"]}
    action: {type: memory_ask, question: "{question}"}

  - id: memory_forget
    label: "Oublier un souvenir"
    description: "Effacer une information retenue (« oublie ce que je t'ai dit sur… »)"
    examples: ["oublie le code du portail", "efface ce que je t'ai dit sur mon dentiste"]
    destructive: true
    args:
      question: {type: text, span: false, patterns: ["^(?P<question>.+)$"]}
    action: {type: memory_forget, question: "{question}"}

  - id: ask_question
    label: "Question : {question}"
    description: "Répondre à une question de culture générale, de définition, de calcul ou d'explication adressée à l'assistant"
    examples: ["dis-moi c'est quoi la capitale du Pérou", "explique-moi ce qu'est une injection SQL", "combien font 17 fois 23", "c'est quoi la différence entre TCP et UDP"]
    destructive: false
    args:
      question:
        type: text
        span: false
        patterns:
          - "^(?:dis[- ]moi|explique[- ]moi|réponds[- ]moi|question)\\s*:?\\s*(?P<question>.+)$"
          - "^(?P<question>.+)$"
    action: {type: ask, question: "{question}"}

  # ---------------------------------------------------------------- page ouverte dans Chrome
  - id: page_link
    label: "Lien de la page"
    description: "Ouvrir un lien ou un résultat de la page déjà affichée dans Chrome : le Nᵉ lien, le meilleur résultat, ou le lien d'un site précis"
    examples: ["clique sur le deuxième lien", "ouvre le premier résultat", "ouvre le meilleur résultat", "clique sur le lien Wikipédia", "ouvre celui du Routard", "ouvre l'article du Monde"]
    destructive: false
    action: {type: page_link}

  # ---------------------------------------------------------------- agent bureau
  - id: desktop_task
    label: "Agent bureau : « {goal} »"
    description: "Tâche en plusieurs clics et saisies dans l'app au premier plan (fenêtres, boutons, champs, cases à cocher), quand aucune commande simple ne suffit"
    examples: ["dans cette fenêtre coche la case ne plus demander et valide", "dans les réglages de l'app active les notifications", "remplis le champ nom avec Camille et clique sur continuer"]
    destructive: false
    always_confirm: true
    args:
      goal: {type: text, span: false, patterns: ["^(?P<goal>.+)$"]}
    action: {type: desktop_task, goal: "{goal}"}

# Routines : une phrase déclenche plusieurs commandes aux arguments FIGÉS (aucun appel Jev par étape).
# Étapes : {run: id_de_commande, with: {argument: valeur}} ou {wait: secondes}.
routines:
  - id: routine_matin
    label: "Routine du matin"
    description: "Lancer la routine du matin / commencer la journée"
    examples: ["lance ma routine du matin", "on commence la journée", "bonjour, démarre ma journée"]
    steps:
      - {run: info, with: {what: date}}
      - {run: agenda_read, with: {when: "aujourd'hui"}}
      - {run: open_app, with: {app: Mail}}
      - {run: open_app, with: {app: Calendar}}

  - id: routine_concentration
    label: "Routine concentration"
    description: "Se mettre en mode concentration / focus pour travailler"
    examples: ["mode concentration", "je me concentre", "lance la routine focus"]
    steps:
      - {run: switch_mode, with: {mode: travail}}
      - {run: set_timer, with: {duration: "25 minutes", label: "pomodoro"}}
